# JamSlot — staging-окружение для CI/CD (ЛР5).
# Запуск: docker compose -f docker-compose.staging.yml up -d --build
# API Gateway: http://localhost:9000
name: jamslot-staging

x-service: &service
  build:
    context: ./services
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on: &deps
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s

x-env: &env
  AMQP_URL: amqp://jamslot:jamslot@rabbitmq:5672/%2F
  VENUE_TIMEZONE: Europe/Moscow
  LOG_LEVEL: INFO
  ENV: staging

services:
  # --- инфраструктура -----------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5434:5432"   # сдвинуто относительно локального 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d booking_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: jamslot
      RABBITMQ_DEFAULT_PASS: jamslot
    ports:
      - "15673:15672"   # сдвинуто относительно локального 15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # --- моки внешних систем ------------------------------------------------------------
  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--verbose"]
    volumes:
      - ./mocks/wiremock:/home/wiremock:ro
    ports:
      - "8090:8080"   # сдвинуто относительно локального 8089

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"   # сдвинуто относительно локального 8025

  # --- сервисы JamSlot ----------------------------------------------------------------
  api-gateway:
    <<: *service
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE_DIR: gateway, PACKAGE: gateway }
    depends_on:
      venue-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      equipment-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    environment:
      JWT_SECRET: jamslot-staging-secret-change-me
      RATE_LIMIT_PER_MINUTE: "300"
    ports:
      - "9000:8080"   # сдвинуто относительно локального 8000

  venue-service:
    <<: *service
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE_DIR: venue-service, PACKAGE: venue_service }
    environment:
      <<: *env
      DATABASE_URL: postgresql://venue_user:venue_pass@postgres:5432/venue_db

  booking-service:
    <<: *service
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE_DIR: booking-service, PACKAGE: booking_service }
    environment:
      <<: *env
      DATABASE_URL: postgresql://booking_user:booking_pass@postgres:5432/booking_db
      VENUE_SERVICE_URL: http://venue-service:8080
      EQUIPMENT_SERVICE_URL: http://equipment-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      PUBLIC_APP_URL: http://localhost:9000
      BOOKING_HOLD_SECONDS: ${BOOKING_HOLD_SECONDS:-900}

  equipment-service:
    <<: *service
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE_DIR: equipment-service, PACKAGE: equipment_service }
    environment:
      <<: *env
      DATABASE_URL: postgresql://equipment_user:equipment_pass@postgres:5432/equipment_db

  payment-service:
    <<: *service
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE_DIR: payment-service, PACKAGE: payment_service }
    depends_on:
      <<: *deps
      wiremock: { condition: service_started }
    environment:
      <<: *env
      DATABASE_URL: postgresql://payment_user:payment_pass@postgres:5432/payment_db
      YOOKASSA_URL: http://wiremock:8080
      YOOKASSA_SHOP_ID: "123456"
      YOOKASSA_SECRET_KEY: test_secret

  notification-service:
    <<: *service
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE_DIR: notification-service, PACKAGE: notification_service }
    depends_on:
      <<: *deps
      mailpit: { condition: service_started }
    environment:
      <<: *env
      DATABASE_URL: postgresql://notification_user:notification_pass@postgres:5432/notification_db
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"

volumes:
  pgdata_staging: