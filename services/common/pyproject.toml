[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jamslot-common"
version = "1.0.0"
description = "Общий код сервисов JamSlot: БД, брокер, outbox, идемпотентность, Problem Details"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "pydantic==2.13.5",
    "requests==2.34.2",
    "PyJWT==2.15.0",
    "psycopg[binary]>=3.2.3,<4",
    "pika>=1.3.2,<2",
    "gunicorn>=23.0,<24",
    "tzdata>=2024.1",
]

[tool.setuptools]
packages = ["jamslot_common"]
