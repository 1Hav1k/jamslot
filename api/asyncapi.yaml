asyncapi: 3.0.0
info:
  title: JamSlot — асинхронные сообщения
  version: 1.0.0
  description: |
    События и команды, которыми сервисы JamSlot обмениваются через RabbitMQ.

    **Топология.** У каждого издателя свой topic-exchange (`booking.events`, `payment.events`,
    `review.events`), ключ маршрутизации равен `eventType`. Каждый подписчик читает собственную
    durable-очередь `<сервис>.<источник>-events`, привязанную к exchange нужными ключами. Команды идут
    через direct-exchange `payment.commands` в единственную очередь получателя. У каждой очереди есть
    очередь недоставленных сообщений `<очередь>.dlq`: сообщение попадает туда после 5 неудачных попыток.

    **Гарантии.** Доставка «не менее одного раза». Издатель пишет сообщение в таблицу outbox в одной
    транзакции с изменением своих данных, отдельный процесс публикует его в брокер. Подписчик хранит
    обработанные `eventId` и пропускает повторы. Порядок сообщений не гарантируется, поэтому
    обработчики проверяют текущий статус сущности и игнорируют недопустимые переходы.

    **Конверт.** Все сообщения имеют общую структуру: `eventId`, `eventType`, `schemaVersion`,
    `occurredAt`, `correlationId`, `producer`, `payload`. Поле `correlationId` равно заголовку
    `X-Correlation-Id` запроса, с которого начался сценарий.
  license:
    name: MIT
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ 4, виртуальный хост `/`
channels:
  bookingEvents:
    address: 'booking.{event}'
    title: События бронирования
    description: Exchange `booking.events` (topic). Адрес канала — ключ маршрутизации.
    parameters:
      event:
        description: Последняя часть ключа маршрутизации
        enum: [confirmed, cancelled, expired, completed]
    messages:
      bookingConfirmed: { $ref: '#/components/messages/BookingConfirmed' }
      bookingCancelled: { $ref: '#/components/messages/BookingCancelled' }
      bookingExpired: { $ref: '#/components/messages/BookingExpired' }
      bookingCompleted: { $ref: '#/components/messages/BookingCompleted' }
    bindings:
      amqp:
        is: routingKey
        exchange: { name: booking.events, type: topic, durable: true, autoDelete: false, vhost: / }
        bindingVersion: 0.3.0
  paymentEvents:
    address: 'payment.{event}'
    title: События платежей
    description: Exchange `payment.events` (topic). Адрес канала — ключ маршрутизации.
    parameters:
      event:
        description: Последняя часть ключа маршрутизации
        enum: [completed, failed, refunded]
    messages:
      paymentCompleted: { $ref: '#/components/messages/PaymentCompleted' }
      paymentFailed: { $ref: '#/components/messages/PaymentFailed' }
      paymentRefunded: { $ref: '#/components/messages/PaymentRefunded' }
    bindings:
      amqp:
        is: routingKey
        exchange: { name: payment.events, type: topic, durable: true, autoDelete: false, vhost: / }
        bindingVersion: 0.3.0
  reviewEvents:
    address: 'review.{event}'
    title: События отзывов
    description: Exchange `review.events` (topic). Адрес канала — ключ маршрутизации.
    parameters:
      event:
        description: Последняя часть ключа маршрутизации
        enum: [published, removed]
    messages:
      reviewPublished: { $ref: '#/components/messages/ReviewPublished' }
      reviewRemoved: { $ref: '#/components/messages/ReviewRemoved' }
    bindings:
      amqp:
        is: routingKey
        exchange: { name: review.events, type: topic, durable: true, autoDelete: false, vhost: / }
        bindingVersion: 0.3.0
  paymentCommands:
    address: payment.refund
    title: Команды платёжному сервису
    description: Exchange `payment.commands` (direct), очередь `payment.refund-commands`.
    messages:
      refundPayment: { $ref: '#/components/messages/RefundPayment' }
    bindings:
      amqp:
        is: routingKey
        exchange: { name: payment.commands, type: direct, durable: true, autoDelete: false, vhost: / }
        bindingVersion: 0.3.0
operations:
  bookingPublishEvents:
    action: send
    channel: { $ref: '#/channels/bookingEvents' }
    title: booking-service публикует события брони
    summary: Издатель — booking-service
    tags: [{ name: booking-service }]
    messages:
      - { $ref: '#/channels/bookingEvents/messages/bookingConfirmed' }
      - { $ref: '#/channels/bookingEvents/messages/bookingCancelled' }
      - { $ref: '#/channels/bookingEvents/messages/bookingExpired' }
      - { $ref: '#/channels/bookingEvents/messages/bookingCompleted' }
  equipmentReceiveBookingEvents:
    action: receive
    channel: { $ref: '#/channels/bookingEvents' }
    title: equipment-service подтверждает или снимает резерв
    summary: Очередь equipment.booking-events
    description: booking.confirmed переводит резерв в CONFIRMED, booking.cancelled и booking.expired — в RELEASED.
    tags: [{ name: equipment-service }]
    x-queue: equipment.booking-events
    messages:
      - { $ref: '#/channels/bookingEvents/messages/bookingConfirmed' }
      - { $ref: '#/channels/bookingEvents/messages/bookingCancelled' }
      - { $ref: '#/channels/bookingEvents/messages/bookingExpired' }
  paymentReceiveBookingEvents:
    action: receive
    channel: { $ref: '#/channels/bookingEvents' }
    title: payment-service отменяет неоплаченный платёж
    summary: Очередь payment.booking-events
    description: Если платёж брони ещё в статусе PENDING, сервис отменяет его у шлюза и переводит в CANCELLED.
    tags: [{ name: payment-service }]
    x-queue: payment.booking-events
    messages:
      - { $ref: '#/channels/bookingEvents/messages/bookingCancelled' }
      - { $ref: '#/channels/bookingEvents/messages/bookingExpired' }
  notificationReceiveBookingEvents:
    action: receive
    channel: { $ref: '#/channels/bookingEvents' }
    title: notification-service отправляет письма о брони
    summary: Очередь notification.booking-events
    description: >-
      Письмо о подтверждении, отмене или истечении брони; по booking.confirmed планируется напоминание,
      по booking.completed — приглашение оставить отзыв.
    tags: [{ name: notification-service }]
    x-queue: notification.booking-events
    messages:
      - { $ref: '#/channels/bookingEvents/messages/bookingConfirmed' }
      - { $ref: '#/channels/bookingEvents/messages/bookingCancelled' }
      - { $ref: '#/channels/bookingEvents/messages/bookingExpired' }
      - { $ref: '#/channels/bookingEvents/messages/bookingCompleted' }
  reviewReceiveBookingEvents:
    action: receive
    channel: { $ref: '#/channels/bookingEvents' }
    title: review-service запоминает завершённые брони
    summary: Очередь review.booking-events
    description: Сервис сохраняет копию завершённой брони, чтобы проверять право на отзыв без синхронных вызовов.
    tags: [{ name: review-service }]
    x-queue: review.booking-events
    messages:
      - { $ref: '#/channels/bookingEvents/messages/bookingCompleted' }
  paymentPublishEvents:
    action: send
    channel: { $ref: '#/channels/paymentEvents' }
    title: payment-service публикует события платежа
    summary: Издатель — payment-service
    tags: [{ name: payment-service }]
    messages:
      - { $ref: '#/channels/paymentEvents/messages/paymentCompleted' }
      - { $ref: '#/channels/paymentEvents/messages/paymentFailed' }
      - { $ref: '#/channels/paymentEvents/messages/paymentRefunded' }
  bookingReceivePaymentEvents:
    action: receive
    channel: { $ref: '#/channels/paymentEvents' }
    title: booking-service подтверждает или отменяет бронь
    summary: Очередь booking.payment-events
    description: >-
      payment.completed переводит бронь PENDING_PAYMENT в CONFIRMED, payment.failed — в CANCELLED.
      Если оплата пришла по брони в статусе EXPIRED или CANCELLED, сервис отправляет команду payment.refund.
    tags: [{ name: booking-service }]
    x-queue: booking.payment-events
    messages:
      - { $ref: '#/channels/paymentEvents/messages/paymentCompleted' }
      - { $ref: '#/channels/paymentEvents/messages/paymentFailed' }
  notificationReceivePaymentEvents:
    action: receive
    channel: { $ref: '#/channels/paymentEvents' }
    title: notification-service сообщает о возврате
    summary: Очередь notification.payment-events
    tags: [{ name: notification-service }]
    x-queue: notification.payment-events
    messages:
      - { $ref: '#/channels/paymentEvents/messages/paymentRefunded' }
  reviewPublishEvents:
    action: send
    channel: { $ref: '#/channels/reviewEvents' }
    title: review-service публикует события отзывов
    summary: Издатель — review-service
    tags: [{ name: review-service }]
    messages:
      - { $ref: '#/channels/reviewEvents/messages/reviewPublished' }
      - { $ref: '#/channels/reviewEvents/messages/reviewRemoved' }
  venueReceiveReviewEvents:
    action: receive
    channel: { $ref: '#/channels/reviewEvents' }
    title: venue-service обновляет копию рейтинга
    summary: Очередь venue.review-events
    description: Сервис записывает в площадку готовый агрегат из события, поэтому повтор и перестановка сообщений безопасны.
    tags: [{ name: venue-service }]
    x-queue: venue.review-events
    messages:
      - { $ref: '#/channels/reviewEvents/messages/reviewPublished' }
      - { $ref: '#/channels/reviewEvents/messages/reviewRemoved' }
  bookingSendRefundCommand:
    action: send
    channel: { $ref: '#/channels/paymentCommands' }
    title: booking-service просит вернуть деньги
    summary: Издатель — booking-service
    tags: [{ name: booking-service }]
    messages:
      - { $ref: '#/channels/paymentCommands/messages/refundPayment' }
  paymentReceiveRefundCommand:
    action: receive
    channel: { $ref: '#/channels/paymentCommands' }
    title: payment-service выполняет возврат
    summary: Очередь payment.refund-commands
    description: Возврат идемпотентен по eventId команды. После подтверждения шлюза публикуется payment.refunded.
    tags: [{ name: payment-service }]
    x-queue: payment.refund-commands
    messages:
      - { $ref: '#/channels/paymentCommands/messages/refundPayment' }
