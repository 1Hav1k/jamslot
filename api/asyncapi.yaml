              amount: 2000.00
              currency: RUB
              reason: PAID_AFTER_EXPIRATION
  correlationIds:
    scenario:
      description: Сквозной идентификатор сценария, равен X-Correlation-Id исходного запроса
      location: '$message.payload#/correlationId'
  schemas:
    EventEnvelope:
      type: object
      description: Общий конверт всех сообщений
      required: [eventId, eventType, schemaVersion, occurredAt, correlationId, producer, payload]
      properties:
        eventId: { type: string, format: uuid, description: 'Уникальный идентификатор сообщения, по нему подписчики отбрасывают повторы' }
        eventType: { type: string, description: 'Тип сообщения, совпадает с ключом маршрутизации' }
        schemaVersion: { type: integer, minimum: 1, description: Версия схемы payload. Увеличивается при несовместимых изменениях }
        occurredAt: { type: string, format: date-time, description: 'Когда произошло событие, UTC' }
        correlationId: { type: string, format: uuid }
        producer: { type: string, description: Сервис-издатель }
        payload: { type: object }
    Customer:
      type: object
      description: Контакт клиента на момент бронирования (из токена Keycloak)
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
    BookingSnapshot:
      type: object
      description: Снимок брони, достаточный подписчикам без обращения к booking-service
      required: [bookingId, userId, customer, venueId, roomId, venueName, roomName, startsAt, endsAt, totalPrice, currency]
      properties:
        bookingId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        customer: { $ref: '#/components/schemas/Customer' }
        venueId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        venueName: { type: string }
        roomName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        totalPrice: { type: number, minimum: 0 }
        currency: { type: string, enum: [RUB] }
    BookingConfirmedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: booking.confirmed }
            payload: { $ref: '#/components/schemas/BookingSnapshot' }
    BookingCancelledEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: booking.cancelled }
            payload:
              allOf:
                - $ref: '#/components/schemas/BookingSnapshot'
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      enum: [USER_REQUEST, MANAGER_REQUEST, PAYMENT_FAILED, EQUIPMENT_UNAVAILABLE, PAYMENT_UNAVAILABLE]
    BookingExpiredEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: booking.expired }
            payload: { $ref: '#/components/schemas/BookingSnapshot' }
    BookingCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: booking.completed }
            payload: { $ref: '#/components/schemas/BookingSnapshot' }
    PaymentCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: payment.completed }
            payload:
              type: object
              required: [paymentId, bookingId, amount, currency, paidAt]
              properties:
                paymentId: { type: string, format: uuid }
                bookingId: { type: string, format: uuid }
                amount: { type: number, minimum: 0 }
                currency: { type: string, enum: [RUB] }
                paidAt: { type: string, format: date-time }
    PaymentFailedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: payment.failed }
            payload:
              type: object
              required: [paymentId, bookingId, reason]
              properties:
                paymentId: { type: string, format: uuid }
                bookingId: { type: string, format: uuid }
                reason: { type: string, enum: [DECLINED, CANCELLED_BY_USER, PROVIDER_ERROR] }
    PaymentRefundedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: payment.refunded }
            payload:
              type: object
              required: [paymentId, refundId, bookingId, userId, amount, currency]
              properties:
                paymentId: { type: string, format: uuid }
                refundId: { type: string, format: uuid }
                bookingId: { type: string, format: uuid }
                userId: { type: string, format: uuid }
                amount: { type: number, minimum: 0 }
                currency: { type: string, enum: [RUB] }
    VenueRating:
      type: object
      description: Готовый агрегат рейтинга площадки. Подписчик записывает его как есть, если calculatedAt новее сохранённого
      required: [average, count, calculatedAt]
      properties:
        average: { type: [number, 'null'], minimum: 1, maximum: 5 }
        count: { type: integer, minimum: 0 }
        calculatedAt: { type: string, format: date-time }
    ReviewPayload:
      type: object
      required: [reviewId, venueId, roomId, rating, venueRating]
      properties:
        reviewId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        venueRating: { $ref: '#/components/schemas/VenueRating' }
    ReviewPublishedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: review.published }
            payload: { $ref: '#/components/schemas/ReviewPayload' }
    ReviewRemovedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: review.removed }
            payload: { $ref: '#/components/schemas/ReviewPayload' }
    RefundPaymentCommand:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { const: payment.refund }
            payload:
              type: object
              required: [paymentId, bookingId, amount, currency, reason]
              properties:
                paymentId: { type: string, format: uuid }
                bookingId: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, enum: [RUB] }
                reason: { type: string, enum: [BOOKING_CANCELLED, PAID_AFTER_EXPIRATION] }
