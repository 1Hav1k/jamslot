openapi: 3.1.0
info:
  title: equipment-service
  version: 1.0.0
  summary: Прокат оборудования JamSlot
  description: >-
    Прокатный фонд площадок: инструменты, усилители, микрофоны. Сервис ведёт учёт единиц
    и резервирует их на интервал брони. Резерв создаётся синхронно по запросу booking-service,
    а подтверждается и снимается по событиям booking.* (см. asyncapi.yaml).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: API Gateway (внешние эндпоинты /api/v1/**)
  - url: http://equipment-service:8080
    description: Внутренняя сеть (эндпоинты /internal/v1/**)
tags:
  - name: public
    description: Эндпоинты для клиентских приложений, доступны через API Gateway
  - name: internal
    description: Эндпоинты для других сервисов, через API Gateway не публикуются
security:
  - bearerAuth: []
paths:
  /api/v1/equipment:
    get:
      tags: [public]
      operationId: listEquipment
      summary: Список оборудования площадки
      security: []
      parameters:
        - in: query
          name: venueId
          required: true
          description: Площадка, которой принадлежит оборудование
          schema: { type: string, format: uuid }
          example: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
        - in: query
          name: category
          description: Фильтр по категории
          schema: { $ref: '#/components/schemas/EquipmentCategory' }
          example: GUITAR
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница списка оборудования
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentItemPage' }
              example:
                items:
                  - id: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                    venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
                    name: Fender Stratocaster
                    category: GUITAR
                    description: Mexican Standard, струны 10–46
                    totalQuantity: 1
                    pricePerHour: 300.00
                    currency: RUB
                    status: ACTIVE
                page: { page: 0, size: 20, totalElements: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [public]
      operationId: createEquipmentItem
      summary: Добавить позицию оборудования
      description: Доступно менеджеру площадки (venueId должен входить в claim venue_ids токена).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEquipmentItemRequest' }
            example:
              venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
              name: Fender Stratocaster
              category: GUITAR
              description: Mexican Standard, струны 10–46
              totalQuantity: 1
              pricePerHour: 300.00
      responses:
        '201':
          description: Позиция создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentItem' }
              example:
                id: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
                name: Fender Stratocaster
                category: GUITAR
                description: Mexican Standard, струны 10–46
                totalQuantity: 1
                pricePerHour: 300.00
                currency: RUB
                status: ACTIVE
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [public]
      operationId: getEquipmentItem
      summary: Получить позицию оборудования
      security: []
      responses:
        '200':
          description: Позиция оборудования
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentItem' }
              example:
                id: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
                name: Fender Stratocaster
                category: GUITAR
                description: Mexican Standard, струны 10–46
                totalQuantity: 1
                pricePerHour: 300.00
                currency: RUB
                status: ACTIVE
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [public]
      operationId: updateEquipmentItem
      summary: Изменить позицию оборудования
      description: >-
        Доступно менеджеру площадки. Уменьшить totalQuantity ниже числа уже зарезервированных
        единиц нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEquipmentItemRequest' }
            example:
              totalQuantity: 2
      responses:
        '200':
          description: Позиция обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentItem' }
              example:
                id: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
                name: Fender Stratocaster
                category: GUITAR
                description: Mexican Standard, струны 10–46
                totalQuantity: 2
                pricePerHour: 300.00
                currency: RUB
                status: ACTIVE
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/equipment-availability:
    get:
      tags: [public]
      operationId: getEquipmentAvailability
      summary: Доступность оборудования на интервал
      description: Сколько единиц каждой позиции свободно на площадке в указанном интервале.
      security: []
      parameters:
        - in: query
          name: venueId
          required: true
          description: Площадка
          schema: { type: string, format: uuid }
          example: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
        - in: query
          name: startsAt
          required: true
          description: Начало интервала
          schema: { type: string, format: date-time }
          example: '2026-11-20T18:00:00+03:00'
        - in: query
          name: endsAt
          required: true
          description: Конец интервала
          schema: { type: string, format: date-time }
          example: '2026-11-20T20:00:00+03:00'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница списка позиций с числом свободных единиц
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentAvailabilityPage' }
              example:
                items:
                  - itemId: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                    name: Fender Stratocaster
                    category: GUITAR
                    availableQuantity: 1
                    pricePerHour: 300.00
                    currency: RUB
                page: { page: 0, size: 20, totalElements: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /internal/v1/reservations:
    post:
      tags: [internal]
      operationId: createReservation
      summary: Зарезервировать оборудование под бронь
      description: >-
        Вызывает booking-service в рамках саги бронирования. Резерв создаётся в статусе HELD и
        одной транзакцией проверяет остаток по всем позициям. Операция идемпотентна по bookingId:
        повторный запрос для той же брони возвращает уже созданный резерв. Дальше резерв меняется
        только по событиям: booking.confirmed → CONFIRMED, booking.cancelled и booking.expired → RELEASED.
      security:
        - serviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
            example:
              bookingId: 9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a
              venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
              startsAt: '2026-11-20T18:00:00+03:00'
              endsAt: '2026-11-20T20:00:00+03:00'
              holdUntil: '2026-11-13T19:20:00+03:00'
              items:
                - { itemId: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e, quantity: 1 }
      responses:
        '201':
          description: Оборудование зарезервировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              example:
                id: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
                bookingId: 9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a
                venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
                status: HELD
                startsAt: '2026-11-20T18:00:00+03:00'
                endsAt: '2026-11-20T20:00:00+03:00'
                holdUntil: '2026-11-13T19:20:00+03:00'
                items:
                  - itemId: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                    name: Fender Stratocaster
                    quantity: 1
                    pricePerHour: 300.00
                    price: 600.00
                totalPrice: 600.00
                currency: RUB
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: На интервал не хватает свободных единиц
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: urn:jamslot:problem:equipment-unavailable
                title: Оборудование недоступно
                status: 409
                code: EQUIPMENT_UNAVAILABLE
                detail: Fender Stratocaster — свободно 0 из 1
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /internal/v1/reservations/{reservationId}:
    parameters:
      - in: path
        name: reservationId
        required: true
        description: Идентификатор резерва
        schema: { type: string, format: uuid }
        example: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
    get:
      tags: [internal]
      operationId: getReservation
      summary: Получить резерв оборудования
      description: Используется booking-service для сверки состояния, если ответ на создание резерва был потерян.
      security:
        - serviceAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Резерв
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              example:
                id: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
                bookingId: 9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a
                venueId: 5d1c7a3e-0f4b-4c2a-9b6d-3e8f1a2b4c5d
                status: CONFIRMED
                startsAt: '2026-11-20T18:00:00+03:00'
                endsAt: '2026-11-20T20:00:00+03:00'
                holdUntil: '2026-11-13T19:20:00+03:00'
                items:
                  - itemId: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
                    name: Fender Stratocaster
                    quantity: 1
                    pricePerHour: 300.00
                    price: 600.00
                totalPrice: 600.00
                currency: RUB
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    ItemId:
      in: path
      name: itemId
      required: true
      description: Идентификатор позиции оборудования
      schema: { type: string, format: uuid }
      example: e7b1d2c3-4a5f-4b6c-8d7e-9f0a1b2c3d4e
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >-
        Ключ идемпотентности (UUID). Повтор запроса с тем же ключом возвращает
        результат первого запроса и не создаёт дубль. Ключ хранится 24 часа.
      schema: { type: string, format: uuid }
      example: 7c1f0a52-3b7e-4d0e-9a41-2f6d8c5b1e90
    CorrelationId:
      in: header
      name: X-Correlation-Id
      required: false
      description: >-
        Сквозной идентификатор сценария. Выставляет API Gateway, сервисы передают его
        дальше в вызовах и копируют в поле correlationId событий.
      schema: { type: string, format: uuid }
      example: 0b9d6c1e-52a4-4f3b-8e77-1c2d3e4f5a6b
    Page:
      in: query
      name: page
      description: Номер страницы, начиная с 0
      schema: { type: integer, minimum: 0, default: 0 }
      example: 0
    Size:
      in: query
      name: size
      description: Размер страницы
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
  schemas:
    EquipmentCategory:
      type: string
      enum: [GUITAR, BASS, DRUMS, KEYS, AMP, MICROPHONE, OTHER]
    EquipmentItem:
      type: object
      description: Позиция прокатного фонда — модель оборудования и число одинаковых единиц
      required: [id, venueId, name, category, totalQuantity, pricePerHour, currency, status]
      properties:
        id: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/EquipmentCategory' }
        description: { type: string }
        totalQuantity: { type: integer, minimum: 0, description: Сколько единиц есть на площадке }
        pricePerHour: { type: number, minimum: 0 }
        currency: { type: string, enum: [RUB] }
        status: { type: string, enum: [ACTIVE, RETIRED] }
    CreateEquipmentItemRequest:
      type: object
      required: [venueId, name, category, totalQuantity, pricePerHour]
      properties:
        venueId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        category: { $ref: '#/components/schemas/EquipmentCategory' }
        description: { type: string, maxLength: 1000 }
        totalQuantity: { type: integer, minimum: 1, maximum: 100 }
        pricePerHour: { type: number, minimum: 0 }
    UpdateEquipmentItemRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        totalQuantity: { type: integer, minimum: 0, maximum: 100 }
        pricePerHour: { type: number, minimum: 0 }
        status: { type: string, enum: [ACTIVE, RETIRED] }
    EquipmentItemPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EquipmentItem' }
        page: { $ref: '#/components/schemas/PageMeta' }
    EquipmentAvailability:
      type: object
      required: [itemId, name, category, availableQuantity, pricePerHour, currency]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/EquipmentCategory' }
        availableQuantity: { type: integer, minimum: 0 }
        pricePerHour: { type: number, minimum: 0 }
        currency: { type: string, enum: [RUB] }
    EquipmentAvailabilityPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EquipmentAvailability' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ReservationItemRequest:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10 }
    CreateReservationRequest:
      type: object
      required: [bookingId, venueId, startsAt, endsAt, holdUntil, items]
      properties:
        bookingId: { type: string, format: uuid, description: 'Бронь, под которую создаётся резерв' }
        venueId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        holdUntil:
          type: string
          format: date-time
          description: >-
            Срок удержания: время истечения брони плюс 5 минут. Резерв, оставшийся в статусе HELD
            после этого момента, считается зависшим: фоновая задача сообщает о нём в мониторинг,
            автоматически он не снимается.
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ReservationItemRequest' }
    ReservationItem:
      type: object
      required: [itemId, name, quantity, pricePerHour, price]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        pricePerHour: { type: number, minimum: 0 }
        price: { type: number, minimum: 0, description: Стоимость позиции за весь интервал }
    Reservation:
      type: object
      required: [id, bookingId, venueId, status, startsAt, endsAt, holdUntil, items, totalPrice, currency]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        status:
          type: string
          description: HELD — удержан до оплаты; CONFIRMED — бронь оплачена; RELEASED — снят
          enum: [HELD, CONFIRMED, RELEASED]
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        holdUntil: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReservationItem' }
        totalPrice: { type: number, minimum: 0 }
        currency: { type: string, enum: [RUB] }
    Problem:
      type: object
      description: >-
        Единая модель ошибки для всех сервисов JamSlot (RFC 9457 Problem Details).
        Поле code — машиночитаемый код, по которому клиент выбирает поведение.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, description: Идентификатор типа ошибки }
        title: { type: string, description: Краткое описание типа ошибки }
        status: { type: integer, description: HTTP-код ответа }
        code: { type: string, description: Машиночитаемый код ошибки }
        detail: { type: string, description: Пояснение для конкретного случая }
        instance: { type: string, description: 'Путь запроса, на котором возникла ошибка' }
        traceId: { type: string, description: Идентификатор трассировки (X-Correlation-Id) }
        errors:
          type: array
          description: Ошибки по отдельным полям (только для ошибок валидации)
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    PageMeta:
      type: object
      description: Сведения о странице списка
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
  responses:
    BadRequest:
      description: Запрос не прошёл валидацию
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:jamslot:problem:validation-error
            title: Некорректный запрос
            status: 400
            code: VALIDATION_ERROR
            detail: Одно или несколько полей заполнены неверно
            traceId: 0b9d6c1e-52a4-4f3b-8e77-1c2d3e4f5a6b
            errors:
              - { field: size, message: должно быть не больше 100 }
    Unauthorized:
      description: Токен отсутствует, просрочен или не прошёл проверку
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:jamslot:problem:unauthorized
            title: Требуется авторизация
            status: 401
            code: UNAUTHORIZED
            detail: Access-токен отсутствует или просрочен
    Forbidden:
      description: Недостаточно прав для операции
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:jamslot:problem:forbidden
            title: Доступ запрещён
            status: 403
            code: FORBIDDEN
            detail: Операция доступна только владельцу ресурса или менеджеру площадки
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:jamslot:problem:not-found
            title: Ресурс не найден
            status: 404
            code: NOT_FOUND
            detail: Объект с указанным идентификатором не существует
    UnprocessableEntity:
      description: Запрос корректен по форме, но нарушает бизнес-правило
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:jamslot:problem:business-rule-violation
            title: Нарушено бизнес-правило
            status: 422
            code: BUSINESS_RULE_VIOLATION
            detail: Интервал выходит за часы работы площадки
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен пользователя, выданный Keycloak (realm jamslot). Проверяется на API Gateway.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Токен сервисной учётной записи Keycloak (client credentials). Используется только
        во внутренних вызовах между сервисами; через API Gateway пути /internal/** недоступны.
