name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, lab5 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------- Этап 1: Сборка и тестирование ----------
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ venue-service, booking-service, payment-service, equipment-service, notification-service, api-gateway ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/unit -v --tb=short
      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

  # ---------- Этап 2: Сборка Docker-образов (валидация) ----------
  build-image:
    name: Build Docker image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { service: venue-service,        dir: venue-service,        package: venue_service }
          - { service: booking-service,      dir: booking-service,      package: booking_service }
          - { service: equipment-service,    dir: equipment-service,    package: equipment_service }
          - { service: payment-service,      dir: payment-service,      package: payment_service }
          - { service: notification-service, dir: notification-service, package: notification_service }
          - { service: api-gateway,          dir: gateway,              package: gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          build-args: |
            SERVICE_DIR=${{ matrix.dir }}
            PACKAGE=${{ matrix.package }}
          platforms: linux/arm64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Этап 3: Публикация в GHCR ----------
  publish:
    name: Publish booking-service to GHCR
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          build-args: |
            SERVICE_DIR=booking-service
            PACKAGE=booking_service
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/booking-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/booking-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Этап 4: Деплой в staging на self-hosted runner ----------
  deploy-staging:
    name: Deploy to Staging (Self-hosted Runner on Mac)
    runs-on: [self-hosted, macOS, ARM64]
    needs: build-image
    if: github.ref == 'refs/heads/lab5' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: http://localhost:9000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify Docker is available
        shell: bash
        run: |
          docker --version
          docker compose version
          echo "Architecture: $(docker info --format '{{.Architecture}}')"

      - name: Deploy staging stack
        shell: bash
        run: |
          set -e
          echo ">>> Stopping old staging containers (if any)..."
          docker compose -f docker-compose.staging.yml down --remove-orphans || true
          echo ">>> Building and starting containers..."
          docker compose -f docker-compose.staging.yml up -d --build
          echo ">>> Current status:"
          docker compose -f docker-compose.staging.yml ps

      - name: Health check
        shell: bash
        run: |
          echo ">>> Waiting for API Gateway on http://localhost:9000/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "API Gateway is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API Gateway did not become healthy in time"
          docker compose -f docker-compose.staging.yml logs --tail=80
          exit 1